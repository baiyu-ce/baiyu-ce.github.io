  <body>
    <div id="root"></div>
    <script>
      (() => {
        const applyCoverUpdate = () => {
          const image = document.querySelector(".hero-campus > img");
          if (!image) return false;

          image.src = "/campus/hku-main-building-sunlit.webp";
          image.alt = "阳光下的香港大学本部大楼红砖建筑";
          image.width = 1800;
          image.height = 1200;

          const credit = document.querySelector(
            '.photo-credits a[href="https://commons.wikimedia.org/wiki/File:The_University_of_Hong_Kong_Main_Building.jpg"]',
          );
          if (credit) {
            credit.href = "https://commons.wikimedia.org/wiki/File:Main_Building_HKU_20100926_03.JPG";
            credit.textContent = "Sunlit Main Building";
            if (credit.nextSibling?.nodeType === Node.TEXT_NODE) {
              credit.nextSibling.textContent = " · Ka-Fai,So · ";
            }
          }
          return true;
        };

        if (!applyCoverUpdate()) {
          const observer = new MutationObserver(() => {
            if (applyCoverUpdate()) observer.disconnect();
          });
          observer.observe(document.getElementById("root"), { childList: true, subtree: true });
        }
      })();
    </script>
  </body>
